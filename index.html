<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Facet</title>
<meta name="description" content="A slim viewer for exploring loose diamonds — fast filters, inline 360° video, one-tap certificates." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <!-- ================= FILTER RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand"><div class="mark">Facet<em>.</em></div></div>
      <button class="apply-btn" id="applyBtn" title="Reapply the filters now">Apply</button>
    </div>
    <div class="site-tag"><span class="dot"></span><span id="siteName">loading…</span></div>

    <div class="grp">
      <span class="lbl">Shape</span>
      <div class="shapes" id="shapes"></div>
    </div>

    <div class="grp">
      <span class="lbl">Carat</span>
      <div class="rangebox">
        <input class="in" id="caratMin" inputmode="decimal" placeholder="min" />
        <span class="sep">–</span>
        <input class="in" id="caratMax" inputmode="decimal" placeholder="max" />
      </div>
    </div>

    <div class="grp">
      <span class="lbl">Color</span>
      <div class="selrow"><select id="colorHi"></select><select id="colorLo"></select></div>
      <div class="caprow"><span>Best</span><span>Least</span></div>
    </div>

    <div class="grp">
      <span class="lbl">Clarity</span>
      <div class="selrow"><select id="clarityHi"></select><select id="clarityLo"></select></div>
      <div class="caprow"><span>Best</span><span>Least</span></div>
    </div>

    <div class="grp">
      <span class="lbl">Cut</span>
      <div class="selrow"><select id="cutHi"></select><select id="cutLo"></select></div>
      <div class="caprow"><span>Best</span><span>Least</span></div>
    </div>

    <div class="grp">
      <span class="lbl">Price (USD)</span>
      <div class="rangebox">
        <input class="in" id="priceMin" inputmode="numeric" placeholder="min" />
        <span class="sep">–</span>
        <input class="in" id="priceMax" inputmode="numeric" placeholder="max" />
      </div>
    </div>

    <div class="grp">
      <label class="toggle"><input type="checkbox" id="onlyMedia" /> Only with 360° video</label>
      <label class="toggle"><input type="checkbox" id="onlySale" /> On sale</label>
    </div>

    <button class="btn-reset" id="reset">Reset to default</button>
  </aside>
  <div class="scrim-rail" id="scrimRail"></div>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
      </button>
      <div class="searchwrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="search" id="search" placeholder="Full SKU, e.g. 800642473" />
      </div>
      <select class="sortsel" id="sort">
        <option value="">Sort: Featured</option>
        <option value="price|ASC">Price ↑</option>
        <option value="price|DESC">Price ↓</option>
        <option value="carat|ASC">Carat ↑</option>
        <option value="carat|DESC">Carat ↓</option>
      </select>
      <div class="count" id="count">—</div>
      <a href="eurocut.html" class="export-btn" title="Old European Cut 360° Comparison" style="text-decoration:none">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 9 9"/></svg>
        <span>OEC 360°</span>
      </a>
      <a href="ring-cad.html" class="export-btn" title="3D Ring CAD Studio" style="text-decoration:none;background:rgba(56,189,248,0.1);border-color:rgba(56,189,248,0.3);color:#0ea5e9;">
        <span>💍</span>
        <span>Ring CAD</span>
      </a>
      <button class="export-btn" id="linksBtn" title="Copy or import your starred diamonds">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l-4 4 4 4"/><path d="M3 14h13"/><path d="M17 14l4-4-4-4"/><path d="M21 10H8"/></svg>
        <span>Links</span>
      </button>
      <button class="theme-btn" id="themeBtn" aria-label="Toggle light and dark theme" title="Toggle theme">☾</button>
    </div>

    <div class="content">
      <section class="pinned" id="pinnedSection">
        <div class="section-h">
          <div class="t">Starred</div>
          <div class="rule"></div>
          <div class="n" id="pinnedN"></div>
        </div>
        <div class="grid" id="pinnedGrid"></div>
      </section>

      <section style="margin-top:38px">
        <div class="section-h">
          <div class="t">Inventory</div>
          <div class="rule"></div>
          <div class="n" id="invN"></div>
        </div>
        <div class="grid" id="grid"></div>
        <div id="gridEnd"></div>
      </section>
    </div>
  </div>
</div>

<!-- ================= DETAIL OVERLAY ================= -->
<div class="overlay" id="overlay">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="stage" id="stage"></div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
